[platformio]
description = LVGL 9.5.0 display and touch probe for Waveshare ESP32-S3-Touch-LCD-1.9

[env:waveshare_s3_lvgl9]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
board_build.partitions = ../../boards/miniwebradio16MB.csv
board_build.f_flash = 80000000L
board_build.f_boot = 80000000L
board_build.flash_mode = dio
monitor_speed = 921600
upload_speed = 1500000
lib_extra_dirs = ../../lib/lvgl9
lib_deps =
    /Users/allen/Documents/Arduino/libraries/GFX_Library_for_Arduino
build_flags =
    -D BOARD_HAS_PSRAM=1
    -D LV_CONF_SKIP=1
    -D LV_COLOR_DEPTH=16
    -D LV_USE_LOG=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_USE_STDLIB_MALLOC=LV_STDLIB_BUILTIN
    -D LV_USE_STDLIB_STRING=LV_STDLIB_BUILTIN
    -D LV_USE_STDLIB_SPRINTF=LV_STDLIB_BUILTIN
    -Wall
    -Wextra
    -Wno-missing-field-initializers
    -fdiagnostics-color=always
