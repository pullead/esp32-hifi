; 💥💥💥💥💥 PlatformIO Project Configuration File 💥💥💥💥💥

[platformio]
description                 = Internetradio with ESP32x, I2S DAC and Display with Touchpad
extra_configs               = platformio_override.ini

[common]

monitor_speed = 921600 ; 115200
upload_speed  = 1500000
monitor_filters = direct

build_flags =
    -D _SSID='"SSID"'                        ;Better set WiFi credentials in platformio_override.ini, e.g. "MyWiFi"
    -D _PW='"PASSWORD"'                      ;Better set WiFi password in platformio_override.ini, e.g. "MyPassword"
    -D TFT_FONT=0 ; (0) GARAMOND, (1) TFT_TIMES_NEW_ROMAN, (2) TFT_FREE_SERIF_ITALIC, (3) TFT_ARIAL, (4) Z003
    -D NTP_Pool_1='"ptbtime1.ptb.de"' ;note the double quotes
    -D NTP_Pool_2='"europe.pool.ntp.org"'
    -D NTP_Pool_3='"pool.ntp.org"'
    -D configTASKLIST_INCLUDE_COREID=1       ; Include CoreID in TaskList
    -D USE_ESP_IDF_LOG=1
    -D CORE_DEBUG_LEVEL=3                    ; 0 None, 1 Error, 2 Warn, 3 Info, 4 Debug, 5 Verbose
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D ARDUINO_RUNNING_CORE=1                ; Arduino Runs On Core (setup, loop)
    -D ARDUINO_EVENT_RUNNING_CORE=1          ; Events Run On Core
    -D AUDIOTASK_CORE=0                      ; 0 or 1 - reads from the InBuffer, decodes and feeds I2S
    -D BOARD_HAS_PSRAM=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    ; Gate 4: LVGL is now the only screen and touch owner.
    -D MWR_LVGL_UI=1
    ; Newer esp-dsp (managed component, not version-pinned) renamed the
    ; single-frame stateful biquad call from dsps_biquad_sf32 to
    ; dsps_biquad_f32 (identical signature) -- ESP32-audioI2S's Audio.cpp
    ; still calls the old name. Alias it at the preprocessor level rather
    ; than patching the vendored library, so a lib_deps re-fetch doesn't
    ; silently drop the fix.
    -Ddsps_biquad_sf32=dsps_biquad_f32
    -D MONITOR_SPEED=${common.monitor_speed}
    -Wall
    -Wextra
  ;  -Wno-cpp                                 ; Disable #warning directive warnings
  ;  -Wno-format                              ; Disable all format string warnings
  ;  -Wno-unused-function
    -Wno-missing-field-initializers
    -fdiagnostics-color=always
    -Wno-error=class-memaccess

[defaults]
build_flags = ${common.build_flags}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
monitor_filters = ${common.monitor_filters}

;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[esp32s3]
    ; board_build.partitions = boards/miniwebradio4MB.csv  ;  4MB Flash
    ;board_build.partitions = boards/miniwebradio8MB.csv    ;  8MB Flash
    board_build.partitions = boards/miniwebradio16MB.csv    ; 16MB Flash
    ;board_build.partitions = boards/miniwebradio32MB.csv   ; 32MB Flash

    ; board = ESP32-S3-DevKitC-1-N4R8  ;  4 MB quad  Flash, 8MB octal PSRAM
    ;board = ESP32-S3-DevKitC-1-N8R8    ;  8 MB quad  Flash, 8MB octal PSRAM
    board = ESP32-S3-DevKitC-1-N16R8    ; 16 MB quad  Flash, 8MB octal PSRAM
    ;board = ESP32-S3-DevKitC-1-N16R8V  ; 16 MB octal Flash, 8MB octal PSRAM
    ;board = ESP32-S3-DevKitC-1-N32R8V  ; 32 MB octal Flash, 8MB octal PSRAM

    build_unflags = -D CONFIG_ESP_WIFI_REMOTE_ENABLED

    ; 2026-08-06: Flash QIO 80MHz 编译不过（ESP32-S3 的 flash 和 octal PSRAM
    ; 共用同一个 MSPI 核心时钟，IDF 源码里 QIO(STR) 80MHz 这条时钟推导路径
    ; 根本没写，见 esp_hw_support/port/esp32s3/mspi_timing_tuning_configs.h
    ; 的静态断言 "FLASH and PSRAM Mode configuration are not supported"）；
    ; QIO 120MHz 在 SDK 内部逻辑能编译过（120M STR 是唯一写了时钟推导路径
    ; 的 STR 高速档位），但卡在最后一步 esptool 生成镜像：--flash-freq 这
    ; 个 CLI 参数根本不接受 "120m"，只认 80m/60m/48m/40m/30m/26m/24m/20m/
    ; 16m/15m/12m 这几档——120MHz 在固件镜像头层面压根编不出来，工具链级别
    ; 的硬限制，不只是风险问题。退回到已实测烧录验证过能正常开机稳定跑的
    ; QIO 40MHz。
    board_build.f_flash = 40000000L
    board_build.f_boot = 40000000L

;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[ota]
    upload_port     = "MiniWebRadio.local"
    upload_protocol = espota ;update code over WiFi, uploadPort = Auto, must have at least 8MB flash
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[esp32p4]
    ; board_build.partitions = boards/miniwebradio8MB.csv    ;  8MB Flash
    board_build.partitions = boards/miniwebradio16MB.csv   ; 16MB Flash
    ;board_build.partitions = boards/miniwebradio32MB.csv   ; 32MB Flash

    board = ESP32-P4-DevKitC-1-NRW32
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env]
extra_scripts =
    pre:env-extra.py
    pre:patches/patch_audioI2S.py


; Arduino 3.3.6 IDF 5.5.2
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip

; Arduino 3.3.7 IDF 5.5.2
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip

; Arduino 3.3.8 IDF 5.5.4
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip

; Active platform: pioarduino 54.03.21-2
; Build output reports framework-arduinoespressif32 3.2.1 and ESP-IDF 5.4.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip

framework = arduino, espidf

build_flags     = ${defaults.build_flags}
monitor_speed   = ${defaults.monitor_speed}
upload_speed    = ${defaults.upload_speed}
monitor_filters = ${defaults.monitor_filters}


; Arduino_GFX lives at lib/Arduino_GFX/ (like lib/lvgl/, gitignored, vendored
; per-machine) -- PlatformIO's project library scanner picks up anything
; under lib/ automatically, no lib_deps entry needed. Previously this had a
; machine-specific absolute path here; this is the portable equivalent.
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S


; CONFIG_TINYUSB_ENABLED/CONFIG_TINYUSB_MSC_ENABLED in each env's
; custom_sdkconfig below only actually take effect if the `tinyusb` component
; is part of the dependency graph in the first place -- Kconfig options
; belonging to a component that was never pulled in are silently dropped by
; the sdkconfig merge, not errored on. Arduino-esp32's own CMakeLists.txt
; only *links against* tinyusb if CONFIG_TINYUSB_ENABLED is already true
; (see its `maybe_add_component(arduino_tinyusb)` guard) -- it never adds the
; dependency itself, so without this line USB.cpp/USBMSC.cpp silently
; compile as empty stubs (their whole bodies are `#if CONFIG_TINYUSB_ENABLED`)
; and USBMSC::begin() is unreachable. This is what "点击挂载完全没反应"
; traced back to.
custom_component_add =
                          espressif/tinyusb

custom_component_remove =
                          espressif/network_provisioning
                          espressif/esp-zboss-lib
                          espressif/esp-zigbee-lib
                          espressif/esp_rainmaker
                          espressif/rmaker_common
                          espressif/esp_insights
                          espressif/esp_diag_data_store
                          espressif/esp_diagnostics
                          espressif/cbor
                          espressif/qrcode
                          espressif/esp-sr
                          espressif/libsodium
                          espressif/esp-modbus
                          chmorgan/esp-libhelix-mp3
                          espressif/esp32-camera
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32s3]
    board = ${esp32s3.board}
    board_build.partitions = ${esp32s3.board_build.partitions}
    board_build.f_flash = ${esp32s3.board_build.f_flash}
    board_build.f_boot = ${esp32s3.board_build.f_boot}
    custom_sdkconfig =
        # CONFIG_ESPTOOLPY_FLASHFREQ_120M is not set
        # CONFIG_ESPTOOLPY_FLASHFREQ_80M is not set
        CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
        CONFIG_ESPTOOLPY_FLASHFREQ="40m"
        # CONFIG_SPIRAM_SPEED_120M is not set
        # CONFIG_SPIRAM_SPEED_80M is not set
        CONFIG_SPIRAM_SPEED_40M=y
        CONFIG_SPIRAM_SPEED=40
        CONFIG_TINYUSB_ENABLED=y
        CONFIG_TINYUSB_MSC_ENABLED=y
        CONFIG_TINYUSB_CDC_ENABLED=y
    build_unflags = ${esp32s3.build_unflags}
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:lcdprobe]
    framework = arduino
    board = ${esp32s3.board}
    board_build.partitions = ${esp32s3.board_build.partitions}
    board_build.f_flash = ${esp32s3.board_build.f_flash}
    board_build.f_boot = ${esp32s3.board_build.f_boot}
    custom_sdkconfig =
        # CONFIG_ESPTOOLPY_FLASHFREQ_120M is not set
        # CONFIG_ESPTOOLPY_FLASHFREQ_80M is not set
        CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
        CONFIG_ESPTOOLPY_FLASHFREQ="40m"
        # CONFIG_SPIRAM_SPEED_120M is not set
        # CONFIG_SPIRAM_SPEED_80M is not set
        CONFIG_SPIRAM_SPEED_40M=y
        CONFIG_SPIRAM_SPEED=40
        CONFIG_TINYUSB_ENABLED=y
        CONFIG_TINYUSB_MSC_ENABLED=y
        CONFIG_TINYUSB_CDC_ENABLED=y
    build_src_filter =
        -<*>
        +<lcd_probe.cpp>
    build_unflags = ${esp32s3.build_unflags}
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32s3_OTA]
    board = ${esp32s3.board}
    # Single 12MB app partition, no ota_0/otadata -- this board never
    # actually used network OTA (ArduinoOTA.begin() was removed from
    # main.cpp along with this), and the second 6MB app slot was wasted
    # space once the CJK font subset (bpp=4, covers GB2312 + JIS kanji +
    # Latin-1 accents) needed more room than one 6MB slot could give it. See
    # boards/miniwebradio16MB_single.csv -- factory now runs from 0x10000 to
    # right where ffat used to start (0xC10000), so ffat/coredump didn't
    # need to move. Flashing this partition table onto a device previously
    # flashed with the old dual-partition layout requires a full
    # `erase_flash` first (stale otadata/partition-table bytes from the old
    # layout aren't compatible with this one).
    board_build.partitions = boards/miniwebradio16MB_single.csv
    board_build.f_flash = ${esp32s3.board_build.f_flash}
    board_build.f_boot = ${esp32s3.board_build.f_boot}
    # 2026-08-06: Flash QIO 80MHz 编译不过（ESP32-S3 的 flash 和 octal PSRAM
    # 共用同一个 MSPI 核心时钟，IDF 源码里根本没写 QIO(STR) 80MHz 这条时钟
    # 推导路径，见 mspi_timing_tuning_configs.h 的静态断言 "FLASH and PSRAM
    # Mode configuration are not supported"）。QIO 40MHz 已经实测烧录验证过
    # 能正常开机、跑稳。现在测试 QIO 120MHz + PSRAM 120MHz 这个组合（唯一
    # 能编译过的 STR 高速档位）——Octal PSRAM 120MHz 本身是乐鑫官方标注的
    # "experimental" 功能（原话：温度比开机时漂移约20摄氏度会导致 PSRAM 访
    # 问随机崩溃），用户已知情，要求实测对比稳定性。
    board_build.flash_mode = qio
    custom_sdkconfig =
        CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
        # CONFIG_ESPTOOLPY_FLASHMODE_QOUT is not set
        # CONFIG_ESPTOOLPY_FLASHMODE_DIO is not set
        # CONFIG_ESPTOOLPY_FLASHMODE_DOUT is not set
        # CONFIG_ESPTOOLPY_FLASHFREQ_120M is not set
        # CONFIG_ESPTOOLPY_FLASHFREQ_80M is not set
        CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
        CONFIG_ESPTOOLPY_FLASHFREQ="40m"
        CONFIG_SPIRAM_SPEED_120M=y
        # CONFIG_SPIRAM_SPEED_80M is not set
        # CONFIG_SPIRAM_SPEED_40M is not set
        CONFIG_SPIRAM_SPEED=120
        CONFIG_TINYUSB_ENABLED=y
        CONFIG_TINYUSB_MSC_ENABLED=y
        CONFIG_TINYUSB_CDC_ENABLED=y
        # WiFi's own esp_wifi_init() reserves all of these buffers up front,
        # out of the same tight internal-RAM budget audio (~71KB) and WiFi
        # itself compete for at boot -- see setupLvglRuntime()'s comment in
        # main.cpp. This is a single-station internet radio, not a
        # high-throughput AP, so the defaults (sized for aggregated
        # multi-stream traffic) are far more than it needs. Trims the
        # up-front reservation without affecting whether a connection can be
        # made at all.
        CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
        CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=12
        CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=12
        CONFIG_ESP_WIFI_MGMT_SBUF_NUM=8
        # CONFIG_ESP_WIFI_AMPDU_TX_ENABLED is not set
        # CONFIG_ESP_WIFI_AMPDU_RX_ENABLED is not set
        # 2026-09-03 性能实验（已回退，勿直接重新启用）：试过把指令缓存
        # 16KB->32KB、数据缓存 32KB->64KB、并关掉 ESP-IDF 断言。三项配置确认
        # 生效（编译期 sdkconfig.h 里是 0x8000/0x10000/LEVEL 0），固件也正常
        # 编译烧录成功，但板子刷完之后从 USB 上彻底消失——连按 BOOT+RESET 进
        # ROM 下载模式都认不到，需要物理干预才恢复。
        #
        # 缓存那 48KB 是直接从内部 SRAM 划走的，而这块板的内部 RAM 本来就紧
        # （见 setupLvglRuntime() 的注释：WiFi 的 esp_wifi_init() 要约 35KB，
        # 一直在跟音频 I2S DMA 抢）。48KB 一次拿走太激进。
        #
        # 如果以后要重试：一次只动一项，优先只把指令缓存加到 32KB（多占
        # 16KB），先确认能开机、WiFi 能连、能跑一段时间，再考虑数据缓存。
        # 每次改完务必先查 .pio/build/<env>/config/sdkconfig.h 确认真的生效
        # ——注意 sdkconfig.defaults 里写死了这些值，光改 custom_sdkconfig
        # 会被静默忽略（这次就先踩了这个坑，白测了一轮）。
    upload_port = ${ota.upload_port}
    upload_protocol = ${ota.upload_protocol}
    build_unflags = ${esp32s3.build_unflags}
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32p4]
    board = ${esp32p4.board}
    board_build.partitions  = ${esp32p4.board_build.partitions}
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32p4_OTA]
    board = ${esp32p4.board}
    board_build.partitions = ${esp32p4.board_build.partitions}
    upload_port = ${ota.upload_port}
    upload_protocol = ${ota.upload_protocol}
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
